<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Mail Triage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 h-screen flex flex-col overflow-hidden font-sans antialiased relative">

  <!-- Rejection / Notification Toast -->
  <div id="toastNotification" class="fixed top-16 right-6 z-50 transform -translate-y-4 opacity-0 pointer-events-none transition-all duration-200 ease-out flex items-center gap-2 bg-rose-950 text-rose-200 border border-rose-800 text-xs px-3.5 py-2 rounded-lg shadow-xl">
    <svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span id="toastMessage" class="font-medium">Action rejected</span>
  </div>

  <!-- Top Bar -->
  <header class="h-14 border-b border-zinc-800 px-6 flex items-center justify-between bg-zinc-900/60 shrink-0">
    <div class="flex items-center gap-3">
      <span id="workerHeartbeat" class="w-2.5 h-2.5 rounded-full bg-zinc-600 transition-colors"></span>
      <h1 class="text-xs font-semibold tracking-wider uppercase text-zinc-400">Local Triage Studio</h1>
      <span id="workerStatusBadge" class="font-mono text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">Idle</span>
    </div>

    <div class="flex items-center gap-2">
      <button id="softResetBtn" onclick="triggerReset('soft')" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 disabled:cursor-not-allowed">
        <span id="softResetSpinner" class="hidden">
          <svg class="animate-spin h-3.5 w-3.5 text-current" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </span>
        <span id="softResetLabel">Soft Reset (100)</span>
      </button>

      <button id="fullResetBtn" onclick="triggerReset('full')" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-900/60 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 disabled:cursor-not-allowed">
        <span id="fullResetSpinner" class="hidden">
          <svg class="animate-spin h-3.5 w-3.5 text-current" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </span>
        <span id="fullResetLabel">Full Reset (All)</span>
      </button>

      <button id="syncBtn" onclick="triggerSync()" class="bg-zinc-100 hover:bg-white text-zinc-950 font-medium px-3.5 py-1.5 rounded-lg text-xs transition shadow-sm flex items-center gap-1.5 disabled:cursor-not-allowed">
        <span id="syncSpinner" class="hidden">
          <svg class="animate-spin h-3.5 w-3.5 text-zinc-950" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </span>
        <span id="syncLabel">Sync New</span>
      </button>
    </div>
  </header>

  <!-- Real-Time Progress / Monitor Bar -->
  <div class="border-b border-zinc-800 bg-zinc-900/30 px-6 py-2.5 shrink-0 flex flex-col gap-1.5">
    <div class="flex justify-between items-center text-xs">
      <div class="flex items-center gap-2 truncate max-w-[65%]">
        <span class="text-zinc-500 font-mono">TASK:</span>
        <span id="activeEmailName" class="text-zinc-300 truncate font-mono text-[11px]">No active background tasks</span>
      </div>
      <div class="font-mono text-[11px] text-zinc-400 flex items-center gap-2">
        <span id="statsLabel">0/0 Triaged</span>
        <span id="pctLabel" class="text-emerald-400 font-semibold">0%</span>
      </div>
    </div>
    <div class="w-full bg-zinc-800/60 h-1.5 rounded-full overflow-hidden">
      <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
    </div>
  </div>

  <!-- Content Workspace -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Left Drawer -->
    <section class="w-5/12 border-r border-zinc-800 flex flex-col h-full overflow-hidden">
      <div class="p-3 border-b border-zinc-800/80 bg-zinc-900/20 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-1">
          <button onclick="setFilter('ALL')" id="filter-ALL" class="urgency-tab px-2.5 py-1 rounded text-xs font-mono bg-zinc-800 text-zinc-100">ALL</button>
          <button onclick="setFilter('HIGH')" id="filter-HIGH" class="urgency-tab px-2.5 py-1 rounded text-xs font-mono text-zinc-400 hover:text-zinc-200">HIGH</button>
          <button onclick="setFilter('MEDIUM')" id="filter-MEDIUM" class="urgency-tab px-2.5 py-1 rounded text-xs font-mono text-zinc-400 hover:text-zinc-200">MED</button>
          <button onclick="setFilter('LOW')" id="filter-LOW" class="urgency-tab px-2.5 py-1 rounded text-xs font-mono text-zinc-400 hover:text-zinc-200">LOW</button>
        </div>
        <button onclick="loadEmails()" title="Refresh List" class="text-zinc-400 hover:text-zinc-200 p-1 rounded hover:bg-zinc-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto divide-y divide-zinc-800/50" id="listPane">
        <div class="p-6 text-zinc-600 text-xs text-center">Loading mail...</div>
      </div>
    </section>

    <!-- Right Drawer -->
    <section class="w-7/12 p-6 overflow-y-auto bg-zinc-900/10" id="detailPane">
      <div class="h-full flex items-center justify-center text-zinc-600 text-sm">Select an email to view triage analysis</div>
    </section>
  </main>

  <script>
    let emails = [];
    let activeId = null;
    let currentFilter = 'ALL';
    let isWorkerRunning = false;
    let isWorkerIngesting = false;
    let activeStream = null;
    let activeActionType = null; // 'sync', 'soft', 'full', or null
    let toastTimeout = null;

    function showRejectedToast(msg) {
      const toast = document.getElementById('toastNotification');
      const label = document.getElementById('toastMessage');
      label.innerText = msg;
      
      toast.classList.remove('-translate-y-4', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-4', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function updateActionButtons(isIngesting, isRunning) {
      const syncBtn = document.getElementById('syncBtn');
      const softBtn = document.getElementById('softResetBtn');
      const fullBtn = document.getElementById('fullResetBtn');

      const isBusy = isIngesting || isRunning;

      if (!isBusy) {
        activeActionType = null;
        // Restore all buttons
        syncBtn.disabled = false;
        softBtn.disabled = false;
        fullBtn.disabled = false;

        document.getElementById('syncSpinner').classList.add('hidden');
        document.getElementById('syncLabel').innerText = 'Sync New';

        document.getElementById('softResetSpinner').classList.add('hidden');
        document.getElementById('softResetLabel').innerText = 'Soft Reset (100)';

        document.getElementById('fullResetSpinner').classList.add('hidden');
        document.getElementById('fullResetLabel').innerText = 'Full Reset (All)';
        return;
      }

      // If active, keep the current initiating button spinning and disable other buttons
      syncBtn.disabled = activeActionType !== 'sync';
      softBtn.disabled = activeActionType !== 'soft';
      fullBtn.disabled = activeActionType !== 'full';

      if (activeActionType === 'sync') {
        document.getElementById('syncSpinner').classList.remove('hidden');
        document.getElementById('syncLabel').innerText = isIngesting ? 'Fetching IMAP...' : 'Triaging...';
      } else if (activeActionType === 'soft') {
        document.getElementById('softResetSpinner').classList.remove('hidden');
        document.getElementById('softResetLabel').innerText = isIngesting ? 'Fetching IMAP...' : 'Triaging...';
      } else if (activeActionType === 'full') {
        document.getElementById('fullResetSpinner').classList.remove('hidden');
        document.getElementById('fullResetLabel').innerText = isIngesting ? 'Fetching IMAP...' : 'Triaging...';
      }
    }

    function initProgressStream() {
      const evtSource = new EventSource('/api/progress/stream');

      evtSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const { isRunning, isIngesting, isStalled, currentEmail, stats, progressPct } = data;
        
        isWorkerRunning = isRunning;
        isWorkerIngesting = isIngesting;

        const heartbeat = document.getElementById('workerHeartbeat');
        const badge = document.getElementById('workerStatusBadge');

        if (isStalled) {
          heartbeat.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping';
          badge.innerText = 'Stalled';
          badge.className = 'font-mono text-[10px] px-2 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-800';
        } else if (isIngesting) {
          heartbeat.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse';
          badge.innerText = 'Ingesting';
          badge.className = 'font-mono text-[10px] px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-800';
        } else if (isRunning) {
          heartbeat.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
          badge.innerText = 'Processing';
          badge.className = 'font-mono text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800';
        } else {
          heartbeat.className = 'w-2.5 h-2.5 rounded-full bg-zinc-600';
          badge.innerText = 'Idle';
          badge.className = 'font-mono text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-400';
        }

        document.getElementById('progressBar').style.width = `${progressPct}%`;
        document.getElementById('pctLabel').innerText = `${progressPct}%`;
        document.getElementById('statsLabel').innerText = `${stats.completed + stats.failed}/${stats.total} Triaged`;

        document.getElementById('activeEmailName').innerText = currentEmail 
          ? `[${currentEmail.sender}] ${currentEmail.subject}` 
          : (isIngesting ? 'Syncing messages with Gmail...' : (isRunning ? 'Scanning queue...' : 'No active background tasks'));

        updateActionButtons(isIngesting, isRunning);

        if (!isRunning && !isIngesting) {
          loadEmails();
        }
      };

      evtSource.onerror = () => {
        document.getElementById('workerStatusBadge').innerText = 'Reconnecting...';
      };
    }

    async function loadEmails() {
      try {
        const query = currentFilter !== 'ALL' ? `?urgency=${currentFilter}` : '';
        const res = await fetch(`/api/emails${query}`);
        emails = await res.json();
        renderList();

        if (emails.length > 0) {
          if (!activeId || !emails.find(e => e.id === activeId)) {
            select(emails[0].id);
          } else {
            select(activeId);
          }
        } else {
          document.getElementById('detailPane').innerHTML = 
            '<div class="h-full flex items-center justify-center text-zinc-600 text-sm">No emails match the filter</div>';
        }
      } catch (err) {
        console.error('Failed to load emails:', err);
      }
    }

    function setFilter(urgency) {
      currentFilter = urgency;
      document.querySelectorAll('.urgency-tab').forEach(btn => {
        btn.className = 'urgency-tab px-2.5 py-1 rounded text-xs font-mono text-zinc-400 hover:text-zinc-200';
      });
      document.getElementById(`filter-${urgency}`).className = 'urgency-tab px-2.5 py-1 rounded text-xs font-mono bg-zinc-800 text-zinc-100 font-semibold';
      loadEmails();
    }

    async function triggerSync() {
      if (isWorkerIngesting || isWorkerRunning) {
        showRejectedToast('Rejected: a task is already processing.');
        return;
      }

      activeActionType = 'sync';
      updateActionButtons(true, false);

      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        if (res.status === 409) {
          const errData = await res.json();
          showRejectedToast(errData.error || 'Rejected: task in progress.');
          activeActionType = null;
          updateActionButtons(false, false);
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      } catch (err) {
        showRejectedToast(`Sync failed: ${err.message}`);
        activeActionType = null;
        updateActionButtons(false, false);
      }
    }

    async function triggerReset(type) {
      if (isWorkerIngesting || isWorkerRunning) {
        showRejectedToast('Rejected: a task is already processing.');
        return;
      }

      const msg = type === 'soft' 
        ? 'Soft Reset will clear temporary drafts and re-triage the top 100 emails. Proceed?' 
        : 'Full Reset will clear temporary drafts, re-fetch the inbox, and re-triage all emails. Proceed?';
      if (!confirm(msg)) return;

      activeActionType = type;
      updateActionButtons(true, false);

      try {
        emails.forEach(e => { e.suggested_reply = null; });
        if (activeId) select(activeId);

        const res = await fetch(`/api/reset/${type}`, { method: 'POST' });
        if (res.status === 409) {
          const errData = await res.json();
          showRejectedToast(errData.error || 'Rejected: task in progress.');
          activeActionType = null;
          updateActionButtons(false, false);
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      } catch (err) {
        showRejectedToast(`Reset failed: ${err.message}`);
        activeActionType = null;
        updateActionButtons(false, false);
      }
    }

    function renderList() {
      const pane = document.getElementById('listPane');
      if (!emails.length) {
        pane.innerHTML = '<div class="p-6 text-zinc-600 text-xs text-center">No emails found.</div>';
        return;
      }

      pane.innerHTML = emails.map(e => {
        const isPending = e.status === 'PENDING';
        return `
          <div onclick="select('${e.id}')" class="p-4 cursor-pointer transition ${activeId === e.id ? 'bg-zinc-800/60' : 'hover:bg-zinc-900/40'}">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-semibold text-zinc-300 truncate max-w-[200px]">${escapeHtml(e.sender)}</span>
              ${isPending 
                ? '<span class="font-mono text-[9px] px-1.5 py-0.5 rounded border border-zinc-700 bg-zinc-800 text-zinc-400 animate-pulse">QUEUED</span>'
                : `<span class="font-mono text-[10px] px-2 py-0.5 rounded border ${badgeStyle(e.urgency)}">${e.urgency || 'NONE'}</span>`
              }
            </div>
            <div class="text-sm font-medium text-zinc-200 mb-1 truncate">${escapeHtml(e.subject)}</div>
            <p class="text-xs text-zinc-500 line-clamp-2">${isPending ? 'Pending analysis...' : escapeHtml(e.tldr || '')}</p>
          </div>
        `;
      }).join('');
    }

    function select(id) {
      if (activeStream) {
        activeStream.close();
        activeStream = null;
      }

      activeId = id;
      renderList();
      const mail = emails.find(e => e.id === id);
      if (!mail) return;

      const detail = document.getElementById('detailPane');
      const hasReply = mail.suggested_reply && mail.suggested_reply.trim().length > 0;
      const isPending = mail.status === 'PENDING';

      detail.innerHTML = `
        <div class="max-w-2xl space-y-6">
          <div class="p-4 rounded-xl bg-zinc-900/80 border border-zinc-800 space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-mono text-xs text-emerald-400 font-medium tracking-wide">AI TRIAGE SUMMARY</span>
              <span class="font-mono text-[10px] px-2 py-0.5 rounded border border-zinc-700 bg-zinc-800 text-zinc-300">${mail.category || (isPending ? 'PENDING' : 'UNCATEGORIZED')}</span>
            </div>
            <p class="text-sm text-zinc-300 leading-relaxed">${isPending ? '<span class="italic text-zinc-500">Currently awaiting LLM analysis in queue...</span>' : escapeHtml(mail.tldr || 'No summary available.')}</p>
          </div>

          <div class="space-y-3" id="draftContainer">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <label class="font-mono text-xs text-zinc-400">DRAFT REPLY</label>
                <span class="font-mono text-[9px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-500">SESSION ONLY</span>
              </div>
              ${hasReply ? `
                <div class="flex items-center gap-2">
                  <button onclick="requestDraft('${mail.id}')" id="generateDraftBtn" class="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 rounded text-zinc-200 transition">Regenerate</button>
                  <button onclick="copyDraft()" id="copyBtn" class="text-xs text-zinc-400 hover:text-zinc-200 transition">Copy</button>
                </div>
              ` : ''}
            </div>

            ${hasReply ? `
              <textarea id="draftArea" class="w-full h-36 p-3 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-300 focus:outline-none focus:border-zinc-700 leading-relaxed resize-none">${escapeHtml(mail.suggested_reply)}</textarea>
            ` : `
              <div id="draftPlaceholder" class="p-4 border border-dashed border-zinc-800 rounded-lg flex flex-col items-center justify-center gap-2 text-center bg-zinc-950/40">
                <span class="text-xs text-zinc-500">No temporary draft generated for this email.</span>
                <button onclick="requestDraft('${mail.id}')" id="generateDraftBtn" class="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3 py-1.5 rounded-md text-zinc-200 font-medium transition">
                  Generate Draft with Ollama
                </button>
              </div>
            `}
          </div>

          <div class="pt-4 border-t border-zinc-800 space-y-2">
            <div class="text-base font-semibold text-zinc-100">${escapeHtml(mail.subject)}</div>
            <div class="font-mono text-xs text-zinc-500">From: ${escapeHtml(mail.sender)} | ${new Date(mail.date).toLocaleString()}</div>
            <div class="text-sm text-zinc-400 leading-relaxed whitespace-pre-line">${escapeHtml(mail.body)}</div>
          </div>
        </div>
      `;
    }

    function requestDraft(id) {
      const container = document.getElementById('draftContainer');
      
      container.innerHTML = `
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-2">
            <label class="font-mono text-xs text-zinc-400">DRAFT REPLY</label>
            <span class="font-mono text-[9px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-500">SESSION ONLY</span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="requestDraft('${id}')" id="generateDraftBtn" disabled class="text-xs bg-zinc-800/50 border border-zinc-800 px-2.5 py-1 rounded text-zinc-500 cursor-not-allowed">Streaming...</button>
            <button onclick="copyDraft()" id="copyBtn" class="text-xs text-zinc-400 hover:text-zinc-200 transition">Copy</button>
          </div>
        </div>
        <textarea id="draftArea" class="w-full h-36 p-3 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-300 focus:outline-none focus:border-zinc-700 leading-relaxed resize-none"></textarea>
      `;

      const targetArea = document.getElementById('draftArea');
      targetArea.value = '';

      if (activeStream) activeStream.close();

      activeStream = new EventSource(`/api/emails/${id}/draft/stream`);

      activeStream.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.token) {
          targetArea.value += data.token;
          targetArea.scrollTop = targetArea.scrollHeight;
        }
        if (data.done || data.error) {
          activeStream.close();
          activeStream = null;
          
          const mail = emails.find(item => item.id === id);
          if (mail) mail.suggested_reply = targetArea.value;

          const btn = document.getElementById('generateDraftBtn');
          if (btn) {
            btn.disabled = false;
            btn.innerText = 'Regenerate';
            btn.className = 'text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 rounded text-zinc-200 transition';
          }
        }
      };

      activeStream.onerror = () => {
        if (activeStream) {
          activeStream.close();
          activeStream = null;
        }
        const btn = document.getElementById('generateDraftBtn');
        if (btn) {
          btn.disabled = false;
          btn.innerText = 'Retry Draft';
          btn.className = 'text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 rounded text-zinc-200 transition';
        }
      };
    }

    function copyDraft() {
      const draftArea = document.getElementById('draftArea');
      if (!draftArea) return;
      navigator.clipboard.writeText(draftArea.value);
      const btn = document.getElementById('copyBtn');
      if (btn) {
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy', 1500);
      }
    }

    function badgeStyle(urgency) {
      if (urgency === 'HIGH') return 'border-rose-900/60 bg-rose-950/40 text-rose-300';
      if (urgency === 'MEDIUM') return 'border-amber-900/60 bg-amber-950/40 text-amber-300';
      if (urgency === 'LOW') return 'border-emerald-900/60 bg-emerald-950/40 text-emerald-300';
      return 'border-zinc-800 bg-zinc-900 text-zinc-400';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    initProgressStream();
    loadEmails();
  </script>
</body>
</html>
