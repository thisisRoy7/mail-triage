<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Local Mail Triage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 h-screen flex flex-col overflow-hidden antialiased">
  <!-- Top Bar -->
  <header class="h-14 border-b border-zinc-800/80 px-6 flex items-center justify-between bg-zinc-900/40">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <h1 class="text-sm font-semibold tracking-wide uppercase text-zinc-400">Local Triage</h1>
    </div>
    <button onclick="sync()" id="syncBtn" class="bg-zinc-100 hover:bg-white text-zinc-900 px-3.5 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">
      Sync & Triage
    </button>
  </header>

  <!-- Content Workspace -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Left Drawer (List) -->
    <section class="w-2/5 border-r border-zinc-800/80 overflow-y-auto" id="listPane"></section>

    <!-- Right Drawer (Detail) -->
    <section class="w-3/5 p-6 overflow-y-auto bg-zinc-900/20" id="detailPane">
      <div class="h-full flex items-center justify-center text-zinc-600 text-sm">Select an email to view triage analysis</div>
    </section>
  </main>

  <script>
    let emails = [];
    let activeId = null;

    async function load() {
      const res = await fetch('/api/emails');
      emails = await res.json();
      renderList();
      if (emails.length && !activeId) select(emails[0].id);
    }

    async function sync() {
      const btn = document.getElementById('syncBtn');
      btn.innerText = 'Analyzing...';
      btn.disabled = true;
      try {
        await fetch('/api/sync', { method: 'POST' });
        await load();
      } finally {
        btn.innerText = 'Sync & Triage';
        btn.disabled = false;
      }
    }

    function renderList() {
      const pane = document.getElementById('listPane');
      pane.innerHTML = emails.map(e => `
        <div onclick="select('${e.id}')" class="p-4 border-b border-zinc-800/50 cursor-pointer transition ${activeId === e.id ? 'bg-zinc-800/50' : 'hover:bg-zinc-900/40'}">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-zinc-300 truncate max-w-[200px]">${e.sender}</span>
            <span class="mono text-[10px] px-2 py-0.5 rounded border ${badgeStyle(e.urgency)}">${e.urgency}</span>
          </div>
          <div class="text-sm font-medium text-zinc-200 mb-1 truncate">${e.subject}</div>
          <p class="text-xs text-zinc-500 line-clamp-2">${e.tldr}</p>
        </div>
      `).join('');
    }

    function select(id) {
      activeId = id;
      renderList();
      const mail = emails.find(e => e.id === id);
      const detail = document.getElementById('detailPane');
      detail.innerHTML = `
        <div class="max-w-2xl space-y-6">
          <div class="p-4 rounded-xl bg-zinc-900/80 border border-zinc-800 space-y-3">
            <div class="flex items-center justify-between">
              <span class="mono text-xs text-emerald-400 font-medium tracking-wide">AI TRIAGE SUMMARY</span>
              <span class="mono text-[10px] px-2 py-0.5 rounded border border-zinc-700 bg-zinc-800">${mail.category}</span>
            </div>
            <p class="text-sm text-zinc-300">${mail.tldr}</p>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <label class="mono text-xs text-zinc-400">DRAFT REPLY</label>
              <button onclick="copyDraft()" id="copyBtn" class="text-xs text-zinc-400 hover:text-zinc-200 transition">Copy</button>
            </div>
            <textarea id="draftArea" class="w-full h-32 p-3 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-300 focus:outline-none focus:border-zinc-700 leading-relaxed resize-none">${mail.suggested_reply}</textarea>
          </div>

          <div class="pt-4 border-t border-zinc-800/80 space-y-2">
            <div class="text-base font-semibold text-zinc-100">${mail.subject}</div>
            <div class="mono text-xs text-zinc-500">From: ${mail.sender}</div>
            <div class="text-sm text-zinc-400 leading-relaxed whitespace-pre-line">${mail.body}</div>
          </div>
        </div>
      `;
    }

    function copyDraft() {
      const copyText = document.getElementById('draftArea').value;
      navigator.clipboard.writeText(copyText);
      const btn = document.getElementById('copyBtn');
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy', 1500);
    }

    function badgeStyle(urgency) {
      if (urgency === 'HIGH') return 'border-rose-900/60 bg-rose-950/40 text-rose-300';
      if (urgency === 'MEDIUM') return 'border-amber-900/60 bg-amber-950/40 text-amber-300';
      return 'border-zinc-800 bg-zinc-900 text-zinc-400';
    }

    load();
  </script>
</body>
</html>
