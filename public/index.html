<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Triage Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
          },
          colors: {
            canvas: '#0D0D11',
            surface: 'rgba(23, 23, 30, 0.65)',
            borderGlass: 'rgba(255, 255, 255, 0.07)',
          },
          borderRadius: {
            '3xl': '24px',
          }
        }
      }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
        "motion/react": "https://esm.sh/motion@11.11.17/react?deps=react@18.2.0,react-dom@18.2.0"
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0D0D11;
    }
    .glass-panel {
      background: rgba(22, 22, 28, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card {
      background: rgba(30, 30, 38, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.16); }
  </style>
</head>
<body class="bg-[#0D0D11] text-zinc-100 h-screen w-screen overflow-hidden antialiased select-none relative">
  <div class="fixed top-[-10%] left-[15%] w-[500px] h-[500px] rounded-full bg-indigo-600/10 blur-[140px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[10%] w-[550px] h-[550px] rounded-full bg-emerald-600/5 blur-[150px] pointer-events-none"></div>

  <div id="root" class="relative z-10 h-full w-full flex flex-col"></div>
  <script type="module" src="./client/app.js"></script>
</body>
</html>
