<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Mail Triage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 h-screen flex flex-col overflow-hidden font-sans antialiased">
  <!-- Top Bar -->
  <header class="h-14 border-b border-zinc-800/80 px-6 flex items-center justify-between bg-zinc-900/40 shrink-0">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <h1 class="text-sm font-semibold tracking-wide uppercase text-zinc-400">Local Triage</h1>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="resetData()" id="resetBtn" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800 px-3 py-1.5 rounded-lg text-xs font-medium transition">
        Reset Database
      </button>
      <button onclick="sync()" id="syncBtn" class="bg-zinc-100 hover:bg-white text-zinc-900 px-3.5 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">
        Sync & Triage
      </button>
    </div>
  </header>

  <!-- Content Workspace -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Left Drawer (List) -->
    <section class="w-2/5 border-r border-zinc-800/80 overflow-y-auto" id="listPane">
      <div class="p-6 text-zinc-600 text-xs text-center">Click "Sync & Triage" to load unread mail</div>
    </section>

    <!-- Right Drawer (Detail) -->
    <section class="w-3/5 p-6 overflow-y-auto bg-zinc-900/20" id="detailPane">
      <div class="h-full flex items-center justify-center text-zinc-600 text-sm">Select an email to view triage analysis</div>
    </section>
  </main>

  <script>
    let emails = [];
    let activeId = null;

    async function load() {
      try {
        const res = await fetch('/api/emails');
        emails = await res.json();
        renderList();
        if (emails.length) {
          if (!activeId || !emails.find(e => e.id === activeId)) {
            select(emails[0].id);
          } else {
            select(activeId);
          }
        } else {
          document.getElementById('detailPane').innerHTML = '<div class="h-full flex items-center justify-center text-zinc-600 text-sm">Select an email to view triage analysis</div>';
        }
      } catch (err) {
        console.error('Failed to load emails:', err);
      }
    }

    async function sync() {
      const btn = document.getElementById('syncBtn');
      btn.innerText = 'Analyzing with Ollama...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Sync failed');
        await load();
      } catch (err) {
        alert('Sync failed: ' + err.message);
        console.error(err);
      } finally {
        btn.innerText = 'Sync & Triage';
        btn.disabled = false;
      }
    }

    async function resetData() {
      if (!confirm('This will wipe all locally stored triaged emails so you can sync freshly. Proceed?')) return;
      const btn = document.getElementById('resetBtn');
      btn.innerText = 'Resetting...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/reset', { method: 'POST' });
        if (!res.ok) throw new Error('Failed to reset');
        emails = [];
        activeId = null;
        renderList();
        document.getElementById('detailPane').innerHTML = '<div class="h-full flex items-center justify-center text-zinc-600 text-sm">Select an email to view triage analysis</div>';
      } catch (err) {
        alert('Reset failed: ' + err.message);
      } finally {
        btn.innerText = 'Reset Database';
        btn.disabled = false;
      }
    }

    function renderList() {
      const pane = document.getElementById('listPane');
      if (!emails.length) {
        pane.innerHTML = '<div class="p-6 text-zinc-600 text-xs text-center">No emails found. Click "Sync & Triage" to load unread messages.</div>';
        return;
      }
      pane.innerHTML = emails.map(e => `
        <div onclick="select('${e.id}')" class="p-4 border-b border-zinc-800/50 cursor-pointer transition ${activeId === e.id ? 'bg-zinc-800/50' : 'hover:bg-zinc-900/40'}">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-zinc-300 truncate max-w-[200px]">${e.sender}</span>
            <span class="font-mono text-[10px] px-2 py-0.5 rounded border ${badgeStyle(e.urgency)}">${e.urgency}</span>
          </div>
          <div class="text-sm font-medium text-zinc-200 mb-1 truncate">${e.subject}</div>
          <p class="text-xs text-zinc-500 line-clamp-2">${e.tldr}</p>
        </div>
      `).join('');
    }

    function select(id) {
      activeId = id;
      renderList();
      const mail = emails.find(e => e.id === id);
      if (!mail) return;
      const detail = document.getElementById('detailPane');

      const hasReply = mail.suggested_reply && mail.suggested_reply.trim().length > 0;

      detail.innerHTML = `
        <div class="max-w-2xl space-y-6">
          <div class="p-4 rounded-xl bg-zinc-900/80 border border-zinc-800 space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-mono text-xs text-emerald-400 font-medium tracking-wide">AI TRIAGE SUMMARY</span>
              <span class="font-mono text-[10px] px-2 py-0.5 rounded border border-zinc-700 bg-zinc-800">${mail.category}</span>
            </div>
            <p class="text-sm text-zinc-300">${mail.tldr}</p>
          </div>

          <!-- On-Demand Draft Section -->
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <label class="font-mono text-xs text-zinc-400">DRAFT REPLY</label>
              ${hasReply ? `
                <div class="flex items-center gap-2">
                  <button onclick="requestDraft('${mail.id}')" id="generateDraftBtn" class="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 rounded text-zinc-200 transition">
                    Regenerate
                  </button>
                  <button onclick="copyDraft()" id="copyBtn" class="text-xs text-zinc-400 hover:text-zinc-200 transition">Copy</button>
                </div>
              ` : ''}
            </div>

            ${hasReply ? `
              <textarea id="draftArea" class="w-full h-36 p-3 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-300 focus:outline-none focus:border-zinc-700 leading-relaxed resize-none">${mail.suggested_reply}</textarea>
            ` : `
              <div class="p-4 border border-dashed border-zinc-800 rounded-lg flex flex-col items-center justify-center gap-2 text-center bg-zinc-950/40">
                <span class="text-xs text-zinc-500">No draft generated for this email.</span>
                <button onclick="requestDraft('${mail.id}')" id="generateDraftBtn" class="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3 py-1.5 rounded-md text-zinc-200 font-medium transition">
                  Generate Draft with Ollama
                </button>
              </div>
            `}
          </div>

          <div class="pt-4 border-t border-zinc-800/80 space-y-2">
            <div class="text-base font-semibold text-zinc-100">${mail.subject}</div>
            <div class="font-mono text-xs text-zinc-500">From: ${mail.sender}</div>
            <div class="text-sm text-zinc-400 leading-relaxed whitespace-pre-line">${mail.body}</div>
          </div>
        </div>
      `;
    }

    async function requestDraft(id) {
      const btn = document.getElementById('generateDraftBtn');
      if (btn) {
        btn.innerText = 'Drafting...';
        btn.disabled = true;
      }

      try {
        const res = await fetch(`/api/emails/${id}/draft`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to generate draft');

        const target = emails.find(e => e.id === id);
        if (target) target.suggested_reply = data.suggested_reply;

        if (activeId === id) select(id);
      } catch (err) {
        alert('Draft failed: ' + err.message);
        if (btn) {
          btn.innerText = 'Generate Draft with Ollama';
          btn.disabled = false;
        }
      }
    }

    function copyDraft() {
      const copyText = document.getElementById('draftArea').value;
      navigator.clipboard.writeText(copyText);
      const btn = document.getElementById('copyBtn');
      if (btn) {
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy', 1500);
      }
    }

    function badgeStyle(urgency) {
      if (urgency === 'HIGH') return 'border-rose-900/60 bg-rose-950/40 text-rose-300';
      if (urgency === 'MEDIUM') return 'border-amber-900/60 bg-amber-950/40 text-amber-300';
      return 'border-zinc-800 bg-zinc-900 text-zinc-400';
    }

    load();
  </script>
</body>
</html>
